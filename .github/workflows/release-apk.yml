name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install

      - name: Patch deprecated jcenter() in react-native-get-sms-android
        run: |
          FILE="node_modules/react-native-get-sms-android/android/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i 's/jcenter()/mavenCentral()/g' "$FILE"
            echo "Patched jcenter in $FILE"
          fi

      - name: Prebuild Android
        run: pnpm exec expo prebuild --platform android

      - name: Configure release signing and ABI splits
        run: node scripts/patch-android-release.js

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          OUT_DIR="android/app/build/outputs/apk/release"
          echo "APK outputs:"
          ls -lh "$OUT_DIR"/*.apk
          # Single APK build: app-release.apk -> nader-pay-agent.apk
          if [ -f "$OUT_DIR/app-release.apk" ]; then
            mv "$OUT_DIR/app-release.apk" "$OUT_DIR/nader-pay-agent.apk"
          fi
          echo "Final APK list:"
          ls -lh "$OUT_DIR"/*.apk

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nader-pay-agent-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
